<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <!-- Google Font: Poppins -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background-color: #000000; /* Black background */
        margin: 0;
        color: #ffffff; /* White text */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .login-container {
        background-color: #1a1a1a; /* Dark grey background */
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 15px 25px rgba(76, 78, 249, 0.3);
        width: 100%;
        max-width: 400px;
      }
      .login-container h2 {
        margin-top: 0;
        color: #ffffff;
        font-weight: 800;
        margin-bottom: 30px;
        text-align: center;
      }
      .login-container form {
        display: flex;
        flex-direction: column;
      }
      .form-group {
        position: relative;
        margin-bottom: 20px;
      }
      .form-group input {
        background-color: #1a1a1a; /* Dark grey background */
        border: 1px solid #4c4ef9; /* Blue border */
        border-radius: 8px;
        padding: 14px;
        width: 100%;
        color: #ffffff;
      }
      .form-group input:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(76, 78, 249, 0.25);
      }
      /* Password toggle style */
      .password-toggle {
        position: absolute;
        top: 50%;
        right: 15px;
        transform: translateY(-50%);
        color: #4c4ef9;
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .password-toggle svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }
      #id_password {
        padding-right: 40px;
      }
      .form-group label {
        position: absolute;
        top: -10px;
        left: 14px;
        background-color: #1a1a1a;
        padding: 0 5px;
        color: #4c4ef9;
        font-size: 0.9rem;
      }
      .login-container button {
        background-color: #4c4ef9;
        color: #ffffff;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      .login-container button:hover {
        background-color: #3a3ce0;
      }
      .additional-options {
        margin-top: 20px;
        text-align: center;
      }
      .additional-options a {
        color: #4c4ef9;
        text-decoration: none;
        font-weight: 500;
        margin: 0 10px;
      }
      .additional-options a:hover {
        text-decoration: underline;
      }
      /* Error message styling */
      .error-message {
        color: #ff4d4d;
        text-align: center;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2>Welcome Back</h2>
      <form method="post" action="{% url 'login' %}">
        {% csrf_token %} {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}
        <div class="form-group">
          <label for="id_username">Username</label>
          <input type="text" name="username" id="id_username" required />
        </div>
        <div class="form-group">
          <label for="id_password">Password</label>
          <input type="password" name="password" id="id_password" required />
          <button
            type="button"
            class="password-toggle"
            onclick="togglePassword()"
            aria-label="Show password"
          >
            <!-- Eye Icon (Show) -->
            <svg
              id="eyeIcon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
            >
              <path
                d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
              />
            </svg>
            <!-- Eye Slash Icon (Hide) - Hidden by default -->
            <svg
              id="eyeSlashIcon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              style="display: none"
            >
              <path
                d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 3.33 0 6.29-1.54 8.24-3.97l2.21 2.21 1.28-1.28L3.28 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"
              />
            </svg>
          </button>
        </div>
        <button type="submit">Login</button>
      </form>
      <div class="additional-options">
        <a href="{% url 'guest_login' %}">Continue as Guest</a>
        <a href="{% url 'signup' %}">Sign Up</a>
      </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function togglePassword() {
        const passwordInput = document.getElementById("id_password");
        const eyeIcon = document.getElementById("eyeIcon");
        const eyeSlashIcon = document.getElementById("eyeSlashIcon");
        const toggleButton = document.querySelector(".password-toggle");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          eyeIcon.style.display = "none";
          eyeSlashIcon.style.display = "block";
          toggleButton.setAttribute("aria-label", "Hide password");
        } else {
          passwordInput.type = "password";
          eyeIcon.style.display = "block";
          eyeSlashIcon.style.display = "none";
          toggleButton.setAttribute("aria-label", "Show password");
        }
      }
    </script>
  </body>
</html>
